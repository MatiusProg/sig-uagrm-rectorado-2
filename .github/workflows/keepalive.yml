# Keep-alive: el plan gratis de Supabase pausa un proyecto tras ~7 días sin actividad.
# Todos los días se llama a la función public.ping() de dev y de prod.
# (Antes era cada 3 días y los dos proyectos se pausaron igual el 25-11-2026.)
# Usa variables del REPOSITORIO (no de los ambientes), porque el cron corre desde main
# y el ambiente "dev" solo admite despliegues desde develop.
# Nota: GitHub desactiva los cron de repos públicos tras 60 días sin commits;
# si el repo queda quieto (p. ej. en vacaciones), reactivarlo en la pestaña Actions.
name: Keep-alive Supabase

on:
  schedule:
    - cron: '17 12 * * *'   # 08:17 hora Bolivia, todos los días
  workflow_dispatch:

jobs:
  ping:
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            url_var: SUPABASE_URL_DEV
            key_var: SUPABASE_ANON_KEY_DEV
          - env: prod
            url_var: SUPABASE_URL_PROD
            key_var: SUPABASE_ANON_KEY_PROD
    name: ping ${{ matrix.env }}
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a public.ping()
        env:
          URL: ${{ vars[matrix.url_var] }}
          KEY: ${{ vars[matrix.key_var] }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Ambiente ${{ matrix.env }} sin configurar; nada que mantener vivo."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo
