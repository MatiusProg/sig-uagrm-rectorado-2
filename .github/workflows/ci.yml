# CI: corre en cada Pull Request y en cada push a develop/main.
# Sus dos jobs ("web" y "db") son checks obligatorios para fusionar (ver reglas de rama).
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Valores ficticios: solo se verifica que compile.
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_ANON_KEY: ci

  db:
    name: db (migraciones en Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Levanta un Postgres idéntico al de Supabase y aplica supabase/migrations/* en orden.
      # Si una migración tiene un error, este paso falla y el PR no se puede fusionar.
      - run: supabase db start
      - name: Lint del esquema
        run: supabase db lint --level error
      - name: Tests de base de datos (pgTAP, si existen)
        run: |
          if ls supabase/tests/*.sql >/dev/null 2>&1; then supabase test db; else echo "Sin tests todavía"; fi
